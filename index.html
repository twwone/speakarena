/* =========================================================

const fmt = s => { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const countChars = t => (t.match(/[一-鿿A-Za-z0-9]/g) || []).length;
const countOf = (t, w) => t.split(w).length - 1;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const round1 = n => Math.round(n * 10) / 10;

function analyze(text, m) {
  const chars = countChars(text);
  const minutes = Math.max(m.duration, 1) / 60;
  const cpm = Math.round(chars / minutes);
  const fillers = {}; let fillerTotal = 0;
  FILLERS.forEach(f => { const n = countOf(text, f); if (n) { fillers[f] = n; fillerTotal += n; } });
  const struct = {}; Object.entries(STRUCTURE).forEach(([k, ws]) => { struct[k] = ws.filter(w => text.includes(w)); });
  const bigram = {}; const clean = text.replace(/[^一-鿿]/g, '');
  for (let i = 0; i < clean.length - 1; i++) { const b = clean.slice(i, i + 2); bigram[b] = (bigram[b] || 0) + 1; }
  const skip = new Set(['我們', '大家', '一個', '這個', '我的', '可以', '沒有', '自己', '他們', '你們', '什麼', '不是']);
  const repeats = Object.entries(bigram).filter(([w, n]) => n >= 3 && !skip.has(w) && !FILLERS.includes(w)).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const sentences = text.split(/[。！？!?；;\n，,]+/).map(s => s.trim()).filter(s => countChars(s) > 0);
  const questions = countOf(text, '？') + countOf(text, '?') + countOf(text, '嗎');
  const imagery = ['像', '彷彿', '好像', '如同', '畫面', '想像'].filter(w => text.includes(w));
  const numbers = (text.match(/[0-9０-９]+|[一二三四五六七八九十百千萬]+(個|次|年|分|%|成|倍|天|小時)/g) || []).length;
  return { chars, cpm, fillers, fillerTotal, struct, repeats, sentences, first: sentences[0] || '', last: sentences[sentences.length - 1] || '', questions, imagery, numbers, ...m };
}

/* =========================================================
   評審引擎 1：Gemini（主力，依你的評比重點）
   ========================================================= */
function slidesPromptBlock(deck, segments, imagePages) {
  if (!deck) return { rule: '', block: '', schema: '' };
  const segMap = Object.fromEntries((segments || []).map(s => [s.page, s]));
  const cut = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
  const lines = deck.items.map(it => {
    const seg = segMap[it.page];
    const parts = [`第 ${it.page} 頁`];
    if (segments) parts.push(seg ? `停留 ${fmt(seg.seconds)}${seg.visits > 1 ? `（來回 ${seg.visits} 次）` : ''}` : '演講時沒有翻到這頁');
    parts.push(`投影片文字：${cut(it.text, 500) || (it.visual ? '（請看圖片）' : '（無文字）')}`);
    if (it.notes) parts.push(`講者備註：${cut(it.notes, 300)}`);
    if (seg) parts.push(`這頁講了：「${cut(seg.spoken, 600) || '（幾乎沒講話）'}」`);
    return '- ' + parts.join('｜');
  });
  const imgNote = imagePages.length
    ? `投影片圖片已附上（第 ${imagePages.length === deck.items.length ? `1–${deck.items.length}` : imagePages.join('、')} 頁），每張圖前面有標示頁碼，版面、圖表、錯字請以圖片為準。`
    : '沒有附上投影片圖片，只有投影片文字（PPTX 讀出的文字與備註），版面與圖表無法判斷。';
  const rule = `8. 有提供簡報投影片（共 ${deck.items.length} 頁）。${imgNote}${segments ? '下方有每頁實際停留的秒數，以及講者在那一頁講了什麼。' : '沒有逐頁時間紀錄（講者是貼上文字），請依內容判斷逐字稿的每一段大約對應哪一頁。'}
   請逐頁檢查：(a) 講的內容和這頁投影片是否一致、有沒有漏講投影片上的重點；(b) 是否只是照念投影片上的字；(c) 停留時間是否恰當（一閃而過或拖太久）；(d) 和上一頁的銜接是否自然、有沒有轉場句；(e) 投影片本身的錯字、字太多、圖表看不清楚、版面不整齊等問題。
   結果放在 slides 陣列（每一頁都要有一筆，level 只能是 good、warn、bad），整體的銜接與流暢度寫在 flow，並至少示範兩句可以直接用的轉場句。評分表與四位評審的講評也要參考投影片（例如「格式整齊、無明顯錯字」要看投影片）。`;
  const block = `\n## 簡報投影片（${deck.name}）\n${lines.join('\n')}\n`;
  const schema = `,
  "slides": [
    {"page": 1, "level": "good", "comment": "這頁講得如何：內容是否對得上、有沒有照念、時間是否恰當、投影片本身的問題（40–100 字）", "fix": "具體改法，沒有就填空字串"}
  ],
  "flow": "整體簡報與講述的流暢度：哪幾個換頁卡住、哪裡講太快或太慢，並示範轉場句（120–220 字）"`;
  return { rule, block, schema };
}

${sl.rule}

## 使用者的評比重點
${rubric.trim() || '（使用者未提供，請用一般演講比賽標準：內容、結構、語言、聲音、時間）'}

## 演講資訊
題目／場合：${topic.trim() || '未提供'}
目標時長：${a.target} 分鐘；實際時長：${fmt(a.duration)}
語音數據：字數 ${a.chars}、語速每分鐘 ${a.cpm} 字、停頓 ${a.pauses} 次（最長 ${round1(a.longestPause)} 秒）、音量起伏指數 ${round1(a.volumeVar)}（低於 0.35 代表偏平）、口頭禪 ${a.fillerTotal} 次（${Object.entries(a.fillers).map(([k, v]) => k + '×' + v).join('、') || '無'}）

function parseJsonLoose(s) {
  s = String(s || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(s); } catch (e) {}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1));
  throw new Error('評審回傳的格式無法解析');
}

function blobToBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}

/* =========================================================
   錄音處理：解碼 → 16kHz 單聲道 → MP3（給 Gemini 聽，檔案小）
   ========================================================= */
async function decodeMono(blob, rate = 16000, maxSec = MAX_AUDIO_SEC) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  let decoded;
  try { decoded = await ac.decodeAudioData(await blob.arrayBuffer()); }
  catch (e) { throw new Error('這個錄音檔的格式瀏覽器讀不了，請改用 m4a、mp3、wav 或 mp4。'); }
  finally { try { ac.close(); } catch (e) {} }
  const dur = Math.min(decoded.duration, maxSec);
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(dur * rate)), rate);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start(0);
  const pcm = (await off.startRendering()).getChannelData(0);
  return { pcm, rate, seconds: dur, fullSeconds: decoded.duration };
}

// 從聲音本身算停頓與音量起伏（上傳的錄音檔沒有即時數據，用這個補）
function pcmStats(pcm, rate) {
  const frame = Math.round(rate * 0.02), rms = [];
  let silent = 0, heard = false, pauses = 0, longest = 0;
  for (let i = 0; i + frame <= pcm.length; i += frame) {
    let sum = 0; for (let k = i; k < i + frame; k++) sum += pcm[k] * pcm[k];
    const r = Math.sqrt(sum / frame);
    if (r < SILENCE_RMS) silent += 0.02;
    else { if (silent >= PAUSE_SEC && heard) { pauses++; longest = Math.max(longest, silent); } silent = 0; heard = true; rms.push(r); }
  }
  let volumeVar = 0;
  if (rms.length > 10) { const mean = rms.reduce((a, b) => a + b, 0) / rms.length; volumeVar = Math.sqrt(rms.reduce((a, b) => a + (b - mean) ** 2, 0) / rms.length) / mean; }
  return { pauses, longestPause: longest, volumeVar };
}

function encodeWav(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const x = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
}

async function encodeMp3(pcm, rate, onProgress) {
  await loadScript(LAME);
  const enc = new window.lamejs.Mp3Encoder(1, rate, 32);
  const i16 = new Int16Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) { const x = Math.max(-1, Math.min(1, pcm[i])); i16[i] = x < 0 ? x * 0x8000 : x * 0x7fff; }
  const out = [], block = 1152;
  for (let i = 0, n = 0; i < i16.length; i += block, n++) {
    const b = enc.encodeBuffer(i16.subarray(i, i + block));
    if (b.length) out.push(new Uint8Array(b));
    if (n % 400 === 0) { onProgress && onProgress(Math.round(i / i16.length * 100)); await new Promise(r => setTimeout(r)); }
  }
  const tail = enc.flush(); if (tail.length) out.push(new Uint8Array(tail));
  return new Blob(out, { type: 'audio/mp3' });
}

// 給 Gemini 的錄音：優先 MP3（32kbps，30 分鐘約 7MB）；MP3 工具載入失敗才退回 WAV
const audioCache = new WeakMap();
async function prepareAudio(blob, maxBytes = Infinity, onStatus = () => {}) {
  const hit = audioCache.get(blob);
  if (hit && hit.bytes <= maxBytes) return hit;
  onStatus('整理錄音中…');
  const d = await decodeMono(blob, 16000);
  let out;
  try {
    const mp3 = await encodeMp3(d.pcm, 16000, pct => onStatus(`整理錄音中… ${pct}%`));
    out = { blob: mp3, mime: 'audio/mp3', seconds: d.seconds, truncated: d.fullSeconds > d.seconds + 0.5 };
    if (mp3.size > maxBytes) {
      const keep = Math.max(10, Math.floor(d.seconds * maxBytes / mp3.size));
      const cut = await encodeMp3(d.pcm.subarray(0, keep * 16000), 16000);
      out = { blob: cut, mime: 'audio/mp3', seconds: keep, truncated: true };
    }
  } catch (e) {
    let rate = 16000, pcm = d.pcm;
    if (pcm.length * 2 > maxBytes) { const d8 = await decodeMono(blob, 8000); rate = 8000; pcm = d8.pcm; }
    let truncated = d.fullSeconds > d.seconds + 0.5;
    if (pcm.length * 2 > maxBytes) { pcm = pcm.subarray(0, Math.floor(maxBytes / 2)); truncated = true; }
    out = { blob: encodeWav(pcm, rate), mime: 'audio/wav', seconds: pcm.length / rate, truncated };
  }
  out.bytes = out.blob.size;
  out.b64 = await blobToBase64(out.blob);
  if (!out.truncated) audioCache.set(blob, out);
  return out;
}

/* =========================================================
   簡報：PDF / PPTX / 圖片 → 每頁一張縮圖 + 文字
   ========================================================= */
const scriptCache = {};
function loadScript(src) {
  if (!scriptCache[src]) scriptCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = res; s.onerror = () => { delete scriptCache[src]; rej(new Error('無法載入簡報讀取工具，請確認有網路')); };
    document.head.appendChild(s);
  });
  return scriptCache[src];
}
const RADICAL_FIX = {'⺁':'厂','⺇':'几','⺌':'小','⺍':'小','⺐':'尢','⺓':'幺','⺕':'彐','⺖':'心','⺗':'心','⺘':'手','⺙':'攵','⺛':'无','⺟':'母','⺠':'民','⺡':'水','⺢':'水','⺣':'火','⺤':'爪','⺥':'爪','⺦':'丬','⺧':'牛','⺨':'犬','⺩':'王','⺪':'疋','⺫':'目','⺬':'示','⺭':'示','⺮':'竹','⺯':'糸','⺱':'网','⺲':'网','⺳':'网','⺴':'网','⺵':'网','⺶':'羊','⺷':'羊','⺸':'羊','⺹':'老','⺺':'聿','⺻':'聿','⺼':'肉','⺽':'臼','⺾':'艹','⺿':'艹','⻀':'艹','⻁':'虎','⻂':'衣','⻃':'覀','⻄':'西','⻅':'見','⻆':'角','⻇':'角','⻊':'足','⻌':'辶','⻍':'辶','⻎':'辶','⻏':'阝','⻑':'長','⻒':'長','⻕':'阜','⻖':'阝','⻗':'雨','⻘':'青','⻝':'食','⻞':'食','⻟':'食','⻡':'食','⻣':'骨','⻤':'鬼','⻧':'鹵','⻨':'麥','⻩':'黃','⻬':'齊','⻮':'齒','⻰':'龍','⻱':'龜','⻲':'亀'};
const canvasToJpeg = (cv, q = 0.72) => new Promise(res => cv.toBlob(b => res(b), 'image/jpeg', q));

async function parsePdf(file, onProgress) {
  await loadScript(PDFJS);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  // cMap：讓沒有內嵌字型的中文 PDF 也能正確顯示與讀出文字
  const base = PDFJS.replace(/pdf\.min\.js$/, '');
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), cMapUrl: base + 'cmaps/', cMapPacked: true, standardFontDataUrl: base + 'standard_fonts/' }).promise;
  const n = Math.min(pdf.numPages, MAX_SLIDES), items = [];
  for (let i = 1; i <= n; i++) {
    onProgress(`讀取第 ${i} / ${n} 頁…`);
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2, 1280 / base.width) });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const blob = await canvasToJpeg(cv);
    let text = '';
    try {
      const tc = await page.getTextContent();
      text = tc.items.map(it => it.str + (it.hasEOL ? '\n' : '')).join('').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim()
        // 部分 PDF 會把「行、人、大」等字存成外觀相同的部首字元，轉回一般漢字，免得評審誤判成錯字
        text = text.replace(/[\u2E80-\u2FDF]/g, ch => RADICAL_FIX[ch] || ch.normalize('NFKC'));
    } catch (e) {}
    items.push({ page: i, blob, url: URL.createObjectURL(blob), text, notes: '', visual: true });
  }
  return { kind: 'PDF', total: pdf.numPages, items };
}

// PPTX 沒辦法在瀏覽器裡完整畫出版面，所以讀文字與講者備註，縮圖用文字卡呈現
function textCard(page, text) {
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
  const c = cv.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, 640, 360);
  c.fillStyle = '#000000'; c.fillRect(0, 0, 640, 44);
  c.fillStyle = '#FFD700'; c.font = 'bold 22px "Space Mono", monospace'; c.fillText(`SLIDE ${page}`, 18, 30);
  const lines = (text || '（這頁沒有文字）').split('\n').map(s => s.trim()).filter(Boolean);
  let y = 92; c.fillStyle = '#000000';
  lines.slice(0, 7).forEach((ln, i) => {
    c.font = i === 0 ? '900 30px "Noto Sans TC", sans-serif' : '500 22px "Noto Sans TC", sans-serif';
    const max = i === 0 ? 19 : 26;
    c.fillText(ln.length > max ? ln.slice(0, max) + '…' : ln, 24, y);
    y += i === 0 ? 50 : 36;
  });
  return canvasToJpeg(cv, 0.8);
}

async function parsePptx(file, onProgress) {
  await loadScript(JSZIP);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const read = async p => { const f = zip.file(p); return f ? f.async('string') : ''; };
  const dom = s => new DOMParser().parseFromString(s, 'application/xml');
  const A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const resolve = (from, t) => t.startsWith('/') ? t.slice(1) : (from + t).split('/').reduce((acc, seg) => { if (seg === '..') acc.pop(); else if (seg !== '.') acc.push(seg); return acc; }, []).join('/');
  const textOf = x => [...x.getElementsByTagNameNS(A, 'p')].map(p => [...p.getElementsByTagNameNS(A, 't')].map(t => t.textContent).join('')).filter(s => s.trim()).join('\n');

  let order = [], aspect = 9 / 16;
  try {
    const pres = dom(await read('ppt/presentation.xml'));
    const sz = pres.getElementsByTagNameNS('*', 'sldSz')[0];
    if (sz) aspect = Number(sz.getAttribute('cy')) / Number(sz.getAttribute('cx')) || aspect;
    const rels = dom(await read('ppt/_rels/presentation.xml.rels'));
    const map = {};
    [...rels.getElementsByTagName('Relationship')].forEach(r => { map[r.getAttribute('Id')] = r.getAttribute('Target'); });
    order = [...pres.getElementsByTagNameNS('*', 'sldId')].map(s => map[s.getAttribute('r:id')]).filter(Boolean).map(t => resolve('ppt/', t));
  } catch (e) {}
  if (!order.length) order = Object.keys(zip.files).filter(p => /^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a, b) => parseInt(a.match(/(\d+)\.xml/)[1]) - parseInt(b.match(/(\d+)\.xml/)[1]));
  if (!order.length) throw new Error('這個檔案裡找不到投影片');

  const n = Math.min(order.length, MAX_SLIDES), items = [];
  for (let i = 0; i < n; i++) {
    onProgress(`讀取第 ${i + 1} / ${n} 頁文字…`);
    const path = order[i];
    const sdoc = dom(await read(path));
    const hidden = sdoc.documentElement && sdoc.documentElement.getAttribute('show') === '0';
    const text = textOf(sdoc);
    let notes = '';
    try {
      const relPath = path.replace(/slides\/(slide\d+\.xml)$/, 'slides/_rels/$1.rels');
      const rels = dom(await read(relPath));
      const nr = [...rels.getElementsByTagName('Relationship')].find(r => /notesSlide$/.test(r.getAttribute('Type') || ''));
      if (nr) notes = textOf(dom(await read(resolve(path.replace(/[^/]+$/, ''), nr.getAttribute('Target'))))).split('\n').filter(s => !/^\d+$/.test(s.trim())).join('\n');
    } catch (e) {}
    items.push({ page: i + 1, text, notes, hidden });
  }

  // 用 pptx-preview 照原本版面畫出每一頁，再拍成圖片（給舞台顯示，也給評審看）
  let shots = [];
  try { shots = await renderPptxSlides(file, aspect, onProgress); } catch (e) { console.warn('PPTX 版面重現失敗', e); }
  const visible = items.filter(x => !x.hidden);
  const pairs = shots.length === items.length ? items.map((it, k) => [it, shots[k]])
    : shots.length === visible.length ? visible.map((it, k) => [it, shots[k]]) : [];
  const shotOf = new Map(pairs);
  const out = [];
  let page = 0;
  for (const it of visible) {
    page++;
    const shot = shotOf.get(it);
    const blob = shot || await textCard(page, it.text);
    out.push({ page, blob, url: URL.createObjectURL(blob), text: it.text, notes: it.notes, visual: !!shot });
  }
  const skipped = items.length - visible.length;
  return { kind: 'PPTX', total: order.length, items: out, rendered: out.some(x => x.visual), skippedHidden: skipped };
}

async function renderPptxSlides(file, aspect, onProgress) {
  onProgress('重現投影片版面…');
  await Promise.all([loadScript(PPTX_PREVIEW), loadScript(HTML2CANVAS)]);
  const W = 1280, Hh = Math.round(W * aspect);
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-20000px;top:0;width:${W}px;pointer-events:none;`;
  document.body.appendChild(host);
  try {
    const pv = window.pptxPreview.init(host, { width: W, height: Hh, mode: 'list' });
    await pv.preview(await file.arrayBuffer());
    await new Promise(r => setTimeout(r, 600));
    try { await document.fonts.ready; } catch (e) {}
    const els = [...host.querySelectorAll('.pptx-preview-slide-wrapper')];
    const shots = [];
    for (let k = 0; k < els.length && k < MAX_SLIDES; k++) {
      onProgress(`擷取第 ${k + 1} / ${els.length} 頁…`);
      const cv = await window.html2canvas(els[k], { scale: 1, backgroundColor: '#ffffff', logging: false, useCORS: true, width: W, height: els[k].offsetHeight || Hh });
      shots.push(await canvasToJpeg(cv));
    }
    return shots;
  } finally { host.remove(); }
}

async function parseImages(files, onProgress) {
  const list = [...files].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant', { numeric: true })).slice(0, MAX_SLIDES);
  const items = [];
  for (let i = 0; i < list.length; i++) {
    onProgress(`讀取第 ${i + 1} / ${list.length} 張…`);
    const bmp = await createImageBitmap(list[i]);
    const scale = Math.min(1, 1280 / bmp.width);
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await canvasToJpeg(cv);
    items.push({ page: i + 1, blob, url: URL.createObjectURL(blob), text: '', notes: '', visual: true });
  }
  return { kind: '圖片', total: files.length, items };
}

async function parseSlides(files, onProgress) {
  const arr = [...files];
  if (!arr.length) throw new Error('沒有選到檔案');
  const f = arr[0], name = f.name.toLowerCase();
  let r;
  if (name.endsWith('.pdf') || f.type === 'application/pdf') r = await parsePdf(f, onProgress);
  else if (name.endsWith('.pptx')) r = await parsePptx(f, onProgress);
  else if (name.endsWith('.key')) throw new Error('Keynote 檔請先在 Keynote 選「檔案 → 輸出至 → PDF」再上傳。');
  else if (name.endsWith('.ppt')) throw new Error('舊版 .ppt 請先在 PowerPoint 另存成 PDF 或 .pptx 再上傳。');
  else if (arr.every(x => /^image\//.test(x.type))) r = await parseImages(arr, onProgress);
  else throw new Error('只支援 PDF、PPTX 或圖片檔。Google 簡報、Canva 請先下載成 PDF。');
  return { ...r, name: arr.length > 1 && r.kind === '圖片' ? `${arr.length} 張圖片` : f.name };
}

/* 把錄音期間的換頁紀錄，整理成「每頁停留幾秒、講了什麼」 */
function buildSegments(log, duration, text) {
  if (!log || !log.length) return null;
  const per = {};
  log.forEach((e, i) => {
    const next = log[i + 1];
    const sec = (next ? next.t : duration) - e.t;
    const spoken = text.slice(e.pos, next ? next.pos : undefined);
    const p = per[e.page] || (per[e.page] = { page: e.page, seconds: 0, spoken: '', visits: 0 });
    p.seconds += Math.max(0, sec); p.spoken += spoken; p.visits++;
  });
  return Object.values(per).sort((a, b) => a.page - b.page).map(p => ({ ...p, seconds: Math.round(p.seconds), spoken: p.spoken.replace(/^，|，$/g, '') }));
}

/* AI 聽寫有每段的開始秒數 → 依換頁時間分到每一頁（比用文字位置準） */
function buildSegmentsTimed(log, duration, timed) {
  if (!log || !log.length) return null;
  const per = {};
  log.forEach((e, i) => {
    const end = log[i + 1] ? log[i + 1].t : Infinity;
    const p = per[e.page] || (per[e.page] = { page: e.page, seconds: 0, spoken: '', visits: 0 });
    p.seconds += Math.max(0, Math.min(end, duration) - e.t); p.visits++;
    p.spoken += timed.filter(x => x.start >= e.t - 0.3 && x.start < end - 0.3).map(x => x.text).join('');
  });
  return Object.values(per).sort((a, b) => a.page - b.page).map(p => ({ ...p, seconds: Math.round(p.seconds) }));
}

/* 離線規則版：只看時間分配與是否照念投影片 */
function ruleSlides(deck, segments) {
  if (!deck) return null;
  const segMap = Object.fromEntries((segments || []).map(s => [s.page, s]));
  const shown = deck.items.filter(it => segMap[it.page]);
  const avg = shown.length ? shown.reduce((s, it) => s + segMap[it.page].seconds, 0) / shown.length : 0;
  const bigrams = t => { const c = (t || '').replace(/[^一-鿿A-Za-z0-9]/g, ''); const set = new Set(); for (let i = 0; i < c.length - 1; i++) set.add(c.slice(i, i + 2)); return set; };
  const slides = deck.items.map(it => {
    const seg = segMap[it.page];
    if (!segments) return { page: it.page, level: 'warn', comment: '這次是貼上文字評比，沒有逐頁時間紀錄。錄音時用 ← → 或簡報筆翻頁，才看得出每頁停留時間。', fix: '' };
    if (!seg) return { page: it.page, level: 'bad', comment: '演講時沒有翻到這一頁。', fix: '確認這頁要不要講；不講就刪掉，避免評審以為你漏講。' };
    const sb = bigrams(it.text), spk = bigrams(seg.spoken);
    const overlap = sb.size >= 15 ? [...sb].filter(b => spk.has(b)).length / sb.size : 0;
    if (seg.seconds < 4) return { page: it.page, level: 'bad', comment: `只停留 ${seg.seconds} 秒，一閃而過，評審還沒看清楚就換頁了。`, fix: '每頁至少講一句重點再翻頁，或把這頁併到前後頁。' };
    if (countChars(seg.spoken) < 6) return { page: it.page, level: 'warn', comment: `停留 ${seg.seconds} 秒，但幾乎沒講到話。`, fix: '想好這頁要說的一句話，不要讓畫面空轉。' };
    if (overlap > 0.6) return { page: it.page, level: 'warn', comment: `停留 ${seg.seconds} 秒，講的內容和投影片文字重疊約 ${Math.round(overlap * 100)}%，聽起來像在照念。`, fix: '投影片放關鍵字，口頭補充例子和感受，不要逐字唸。' };
    if (avg && seg.seconds > avg * 2.2 && seg.seconds > 45) return { page: it.page, level: 'warn', comment: `停留 ${fmt(seg.seconds)}，是平均的 ${round1(seg.seconds / avg)} 倍，這頁可能塞太多內容。`, fix: '拆成兩頁，或刪掉次要的細節。' };
    return { page: it.page, level: 'good', comment: `停留 ${seg.seconds} 秒，時間分配合理。`, fix: '' };
  });
  const bad = slides.filter(s => s.level !== 'good').length;
  return { slides, flow: segments ? `共 ${deck.items.length} 頁，平均每頁 ${Math.round(avg)} 秒，${bad ? `有 ${bad} 頁需要注意。` : '每頁時間分配都在合理範圍。'}（這是依時間與文字比對的估算，接上 Gemini 才能判斷內容是否對得上、轉場順不順。）` : '' };
}

/* ---------- Gemini 連線共用：金鑰一律放在 x-goog-api-key 標頭（新版 AQ. 與舊版 AIza 金鑰都適用） ---------- */
const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta';
const cleanKey = k => String(k || '').replace(/[\s"'“”‘’]/g, '');

async function gemini(path, apiKey, body) {
  let res;
  try {
    res = await fetch(`${GEMINI_BASE}/${path}`, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json', 'x-goog-api-key': cleanKey(apiKey) } : { 'x-goog-api-key': cleanKey(apiKey) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    const err = new Error(`連不到 Google 伺服器（${e.message}）。請確認有網路、沒有被 VPN 或學校／公司防火牆擋住，並用 Chrome、Edge 或 Safari 開啟。`);
    err.status = 0; throw err;
  }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = data?.error?.message || res.statusText || '';
    const err = new Error(msg); err.status = res.status; err.raw = msg; throw err;
  }
  return data;
}

function explainGeminiError(e, model) {
  const s = e.status, m = e.raw || e.message;
  if (s === 0) return e.message;
  if ((s === 400 || s === 401) && /key|credential|token|auth/i.test(m)) return `金鑰無效：請在 AI Studio 按複製圖示重新複製完整金鑰（AQ. 或 AIza 開頭）。Google 回應：${m}`;
  if (s === 403) return `這把金鑰不能使用 Gemini API，或所在地區／帳號受限。請到 AI Studio 重新建立金鑰。Google 回應：${m}`;
  if (s === 404) return `模型「${model}」不存在或已下架。Google 回應：${m}`;
  if (s === 429) return `額度用完或請求太頻繁，請等一分鐘再試，或在設定換成 Flash-Lite 模型。Google 回應：${m}`;
  if (s >= 500) return `Google 伺服器忙碌（${s}），請稍後再試。`;
  return `錯誤 ${s}：${m}`;
}

// 取得這把金鑰能用的文字模型，依「穩定版 Flash → 其他 Flash → 其他」排序
async function listGeminiModels(apiKey) {
  const d = await gemini('models?pageSize=200', apiKey);
  return (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => ({ id: m.name.replace(/^models\//, ''), label: m.displayName || m.name }))
    .filter(m => /gemini/i.test(m.id) && !/(embedding|aqa|image|tts|live|audio|robotics|computer|thinking-exp)/i.test(m.id));
}
function pickModel(list) {
  const rank = m => (/flash/i.test(m.id) ? 0 : 2) + (/lite/i.test(m.id) ? 0.5 : 0) + (/preview|exp/i.test(m.id) ? 1 : 0);
  return [...list].sort((a, b) => rank(a) - rank(b) || b.id.localeCompare(a.id, 'en', { numeric: true }))[0];
}

async function geminiReview({ apiKey, model, promptFor, deck, audioBlob, onStatus, onModelChange }) {
  const parts = [];
  // 1) 投影片圖片：每張前面標頁碼，總大小控制在上限的六成以內
  const imagePages = [];
  let used = 0;
  if (deck) {
    onStatus('整理投影片給評審看…');
    for (const it of deck.items.filter(x => x.visual)) {
      if (used + it.blob.size * 1.37 > GEMINI_INLINE_LIMIT * 0.6) break;
      parts.push({ text: `第 ${it.page} 頁投影片：` });
      parts.push({ inline_data: { mime_type: 'image/jpeg', data: await blobToBase64(it.blob) } });
      used += it.blob.size * 1.37 + 40; imagePages.push(it.page);
    }
  }
  // 2) 錄音：用剩下的空間
  let hasAudio = false, audioNote = '';
  if (audioBlob) {
    try {
      const au = await prepareAudio(audioBlob, (GEMINI_INLINE_LIMIT - used - 300 * 1024) / 1.37, onStatus);
      parts.push({ text: '演講錄音：' });
      parts.push({ inline_data: { mime_type: au.mime, data: au.b64 } });
      hasAudio = true;
      if (au.truncated) audioNote = `（錄音太長，只附上前 ${fmt(au.seconds)}）`;
    } catch (e) { onStatus('錄音轉檔失敗，改成只送逐字稿…'); }
  }
  parts.push({ text: promptFor({ imagePages, hasAudio }) + (audioNote ? `\n\n注意：${audioNote}，之後的部分請依逐字稿評。` : '') });
  const body = { contents: [{ role: 'user', parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.5 } };
  onStatus(`評審正在${hasAudio ? '聽錄音、' : ''}${imagePages.length ? '看投影片、' : ''}閱卷中…（約 15–60 秒）`);
  return geminiJson({ apiKey, model, body, onStatus, onModelChange, doing: '評審閱卷中' });
}

// 呼叫 Gemini 並取回 JSON；模型下架（404）時自動換成這把金鑰能用的模型重試
async function geminiJson({ apiKey, model, body, onStatus, onModelChange, doing }) {
  let data;
  try {
    data = await gemini(`models/${encodeURIComponent(model)}:generateContent`, apiKey, body);
  } catch (e) {
    if (e.status !== 404) throw new Error(explainGeminiError(e, model));
    onStatus(`模型 ${model} 不能用，自動尋找可用的模型…`);
    let alt;
    try { alt = pickModel((await listGeminiModels(apiKey)).filter(m => m.id !== model)); } catch (e2) { throw new Error(explainGeminiError(e2, model)); }
    if (!alt) throw new Error(explainGeminiError(e, model));
    onModelChange && onModelChange(alt.id);
    onStatus(`改用 ${alt.id}，${doing}…`);
    try { data = await gemini(`models/${encodeURIComponent(alt.id)}:generateContent`, apiKey, body); }
    catch (e3) { throw new Error(explainGeminiError(e3, alt.id)); }
  }
  const cand = data?.candidates?.[0];
  const text = (cand?.content?.parts || []).filter(p => !p.thought && p.text).map(p => p.text).join('');
  if (!text) throw new Error(cand?.finishReason === 'SAFETY' ? 'Gemini 因安全設定拒絕回應這段內容。' : 'Gemini 沒有回傳內容，請再試一次。');
  return parseJsonLoose(text);
}

/* ---------- Gemini 聽寫逐字稿：比瀏覽器內建辨識準很多，並附每段開始的秒數 ---------- */
async function transcribeWithGemini({ apiKey, model, audioBlob, hints, onStatus, onModelChange }) {
  const au = await prepareAudio(audioBlob, GEMINI_INLINE_LIMIT / 1.37 - 200 * 1024, onStatus);
  const prompt = `請把這段演講錄音逐字聽寫成繁體中文（台灣用語）。
規則：
1. 照實寫下講者說的每一句話，包含口頭禪（嗯、呃、然後、就是、那個）、重複、說錯又改口的地方。不要潤飾、不要摘要、不要自己補字。
2. 加上適當的中文標點符號。
3. 依講話的自然段落切段，每段 1–3 句，標出這段開始的時間（從錄音開頭算起的秒數，數字）。
4. 沒有人說話、只有雜音的部分不用寫。
${hints ? `5. 這場演講可能出現的專有名詞（只用來幫你聽對字，沒講到就不要寫進去）：\n${hints}\n` : ''}
只輸出 JSON：{"segments":[{"start":0,"text":"..."}]}`;
  const body = {
    contents: [{ role: 'user', parts: [{ inline_data: { mime_type: au.mime, data: au.b64 } }, { text: prompt }] }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0 },
  };
  onStatus(`AI 正在聽寫逐字稿…（${fmt(au.seconds)} 的錄音，約 10–40 秒）`);
  const r = await geminiJson({ apiKey, model, body, onStatus, onModelChange, doing: '聽寫逐字稿' });
  const segments = (Array.isArray(r?.segments) ? r.segments : [])
    .map(x => ({ start: Math.max(0, Number(x.start) || 0), text: String(x.text || '').trim() }))
    .filter(x => x.text).sort((a, b) => a.start - b.start);
  if (!segments.length) throw new Error('AI 沒有聽到任何說話內容');
  return { segments, text: segments.map(x => x.text).join(''), truncated: au.truncated, seconds: au.seconds };
}

let samplePromise = null;
function getSample() {
  if (samplePromise) return samplePromise;
  samplePromise = new Promise(res => {
    let n = 0;
    const t = setInterval(() => {
      if (window.claude?.use) { clearInterval(t); window.claude.use('sample').then(res, () => res(null)); }
      else if (++n > 12) { clearInterval(t); res(null); }
    }, 250);
  });
  return samplePromise;
}

/* 統一整理 AI 回傳格式，並自己算加權總分 */
function normalize(r) {
  const rubric = (Array.isArray(r?.rubric) ? r.rubric : []).map(x => ({
    criterion: String(x.criterion || '未命名項目'),
    weight: Number(x.weight) || 0,
    score: x.score == null || x.score === '' || isNaN(Number(x.score)) ? null : clamp(Number(x.score), 0, 10),
    evidence: x.evidence || '', comment: x.comment || '', fix: x.fix || '',
  }));
  const wSum = rubric.reduce((s, x) => s + (x.score != null ? x.weight : 0), 0);
  const total = wSum ? round1(rubric.reduce((s, x) => s + (x.score != null ? x.weight * x.score * 10 : 0), 0) / wSum) : null;
  const judges = {};
  JUDGES.forEach(j => { const v = r?.judges?.[j.id] || {}; judges[j.id] = { score: clamp(Number(v.score) || 5, 0, 10), text: String(v.text || '（這位評審沒有留下評語）') }; });
  const LV = { good: 'good', warn: 'warn', bad: 'bad' };
  const slides = (Array.isArray(r?.slides) ? r.slides : []).map(x => ({
    page: Number(x.page) || 0, level: LV[String(x.level || '').toLowerCase()] || 'warn', comment: String(x.comment || ''), fix: String(x.fix || ''),
  })).filter(x => x.page > 0);
  return { rubric, total, judges, strengths: r?.strengths || [], priorities: r?.priorities || [], rewrite: r?.rewrite || null, scriptCheck: r?.scriptCheck || '', slides, flow: String(r?.flow || '') };
}

/* =========================================================
   評審引擎 3：離線數據規則（沒有任何 AI 時）
   ========================================================= */
function ruleReviews(a) {
  const t = fmt(a.duration), target = a.target * 60, ratio = target ? a.duration / target : 1;
  const tooShort = a.chars < 25, out = {};
  { let s = 6, L = [];
    if (tooShort) { s = 3; L.push(`${t}，${a.chars} 個字。這不是演講，是一句旁白。`); }
    else {
      if (/^(大家好|各位|今天|我要|我想|那|嗯|呃|然後)/.test(a.first)) { s--; L.push(`開場「${a.first.slice(0, 24)}」太制式，前 10 秒請用問題、數字或畫面直接開打。`); } else { s++; L.push(`開場「${a.first.slice(0, 24)}」沒有浪費我的前 10 秒。`); }
      if (ratio > 1.15) { s--; L.push(`超時 ${fmt(a.duration - target)}，代表你沒做取捨。`); } else if (target && ratio < 0.7) { s--; L.push(`只講了 ${t}，材料撐不起舞台。`); } else L.push(`時間 ${t}，控制得還行。`);
      L.push(`收尾「${a.last.slice(0, 20)}」，最後一句就是聽眾帶走的那一句。`);
    }
    out.jobs = { score: clamp(s, 1, 10), text: L.join('') }; }
  { const st = a.struct; let s = 5, L = [];
    if (tooShort) { s = 2; L.push('論點、理由、例證都沒偵測到，請至少完成「主張 → 理由 → 例子 → 結論」。'); }
    else {
      if (st.order.length >= 2) { s += 2; L.push(`有用「${st.order.join('、')}」標示層次。`); } else L.push('聽不出段落在哪裡，請加「第一、第二」這類路標。');
      if (st.cause.length) { s++; L.push(`有因果連接（${st.cause.join('、')}）。`); } else L.push('幾乎沒有「因為、所以」，主張和理由是斷的。');
      if (st.example.length || a.numbers) { s++; L.push('有例子或數字撐住論點。'); } else L.push('沒有例子或數字，主張都是你說了算。');
      if (st.turn.length) { s++; L.push('有回應反面觀點。'); } else L.push('沒有回應反方。');
    }
    out.logic = { score: clamp(s, 1, 10), text: L.join('') }; }
  { let s = 7, L = [];
    if (!a.chars) { s = 4; L.push('沒收到文字。'); }
    else if (a.cpm > 260) { s -= 2; L.push(`語速每分鐘 ${a.cpm} 字，太快（舒適範圍約 180–240）。`); }
    else if (a.cpm < 150) { s--; L.push(`語速每分鐘 ${a.cpm} 字，偏慢。`); }
    else { s++; L.push(`語速每分鐘 ${a.cpm} 字，穩。`); }
    if (a.pauses === 0 && a.duration > 20) { s--; L.push('全程幾乎沒有停頓。'); } else if (a.pauses) L.push(`停頓 ${a.pauses} 次，最長 ${round1(a.longestPause)} 秒。`);
    if (a.duration > 15) { if (a.volumeVar < 0.35) { s--; L.push('音量起伏小，像在唸稿。'); } else { s++; L.push('音量有高低變化。'); } }
    out.rhythm = { score: clamp(s, 1, 10), text: L.join('') }; }
  { let s = 7, L = []; const fl = Object.entries(a.fillers).sort((x, y) => y[1] - x[1]);
    if (tooShort) { s = 4; L.push('試著從一個畫面開始說故事。'); }
    else {
      if (a.fillerTotal >= 6) { s -= 2; L.push(`口頭禪 ${a.fillerTotal} 次（${fl.slice(0, 3).map(([w, n]) => `「${w}」${n}`).join('、')}）。`); }
      else if (a.fillerTotal >= 2) { s--; L.push(`有一點口頭禪（${fl.map(([w, n]) => `「${w}」${n}`).join('、')}）。`); } else { s++; L.push('幾乎沒有口頭禪。'); }
      if (a.repeats.length) L.push(`「${a.repeats[0][0]}」重複 ${a.repeats[0][1]} 次。`);
      if (a.imagery.length || a.questions) { s++; L.push('有比喻或提問，很好。'); } else L.push('試著加一個提問或比喻。');
    }
    out.gentle = { score: clamp(s, 1, 10), text: L.join('') }; }
  return { rubric: [], total: null, judges: out, strengths: [], priorities: [], rewrite: null, scriptCheck: '' };
}

function Waveform({ analyser, live, compact }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const cv = canvasRef.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    let raf; const levels = new Array(compact ? 28 : 40).fill(0.08);
    const resize = () => { const r = cv.getBoundingClientRect(); cv.width = Math.max(1, r.width * devicePixelRatio); cv.height = Math.max(1, r.height * devicePixelRatio); };
    resize(); window.addEventListener('resize', resize);
    const buf = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
    const draw = () => {
      const W = cv.width, H = cv.height, n = levels.length, gap = 4 * devicePixelRatio, bw = (W - gap * (n - 1)) / n;
      if (analyser && live) {
        analyser.getByteFrequencyData(buf);
        const step = Math.floor(buf.length / 2 / n) || 1;
        for (let i = 0; i < n; i++) { let sum = 0; for (let k = 0; k < step; k++) sum += buf[i * step + k]; const v = Math.min(1, (sum / step / 255) * 1.6); levels[i] = levels[i] * 0.55 + Math.max(0.04, v) * 0.45; }
      } else for (let i = 0; i < n; i++) levels[i] = levels[i] * 0.9 + (0.1 + ((i * 37) % 45) / 100) * 0.1;
      ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#000';
      for (let i = 0; i < n; i++) { const h = Math.max(3, levels[i] * H); ctx.fillRect(i * (bw + gap), (H - h) / 2, bw, h); }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [analyser, live, compact]);
  return <canvas ref={canvasRef} className={`w-full ${compact ? 'h-12' : 'h-28'}`} aria-hidden="true"></canvas>;
}

            <span className={`font-body font-black text-xs ${c.state === 'listening' || c.state === 'typing' ? 'blink' : c.state === 'idle' ? 'opacity-50' : ''}`}>{st}</span>
          </div>
        );
      })}
    </div>
  );
}

function Stage({ phase, onToggle, analyser, target, setTarget, micError, liveText, level, deck, slideIdx, setSlideIdx, slideSec, aiTranscribe, cards, onPaste, onGoPrep }) {
  const live = phase === 'live', judging = phase === 'judging';
  const bigBtn = (
    <button type="button" onClick={onToggle} disabled={judging}
      className={`${pressable} w-full py-5 lg:py-7 font-body font-black text-2xl lg:text-3xl tracking-wide ${live ? 'bg-alarm text-white' : 'bg-[#FFD700] text-black'}`}>
      {live ? '■ 結束並聽取講評' : judging ? '評審閱卷中…' : phase === 'done' ? '▶ 再上擂台' : '▶ 開始演講'}
    </button>
  );
  return (
    <section className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_320px] gap-6 items-start">
      <div className={`bg-white border-2 border-black ${hard6} flex flex-col min-w-0`}>
        <div className="flex flex-wrap items-center justify-between gap-2 border-b-2 border-black px-4 py-2 bg-paper">
          <span className="font-display text-sm tracking-widest uppercase">Main Stage</span>
          <div className="flex items-center gap-2">
            <label htmlFor="target" className="font-body font-black text-xs">目標時長</label>
            <select id="target" value={target} disabled={live || judging} onChange={e => setTarget(Number(e.target.value))}
              className="border-2 border-black rounded-none bg-white font-mono text-sm px-1 py-0.5 focus:outline focus:outline-2 focus:outline-black">
              {[1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 15, 20].map(m => <option key={m} value={m}>{m} 分鐘</option>)}
            </select>
            <span className={`font-body font-black text-xs px-2 py-0.5 border-2 border-black ${live ? 'bg-alarm text-white' : judging ? 'bg-gold' : 'bg-white'}`}>
              {live ? '● 錄音中' : judging ? '評審閱卷中' : phase === 'done' ? '講評完成' : '待命'}
            </span>
          </div>
        </div>
        {deck ? (
          <div className="px-3 sm:px-4 py-4"><SlideViewer deck={deck} idx={slideIdx} setIdx={setSlideIdx} live={live} slideSec={slideSec} /></div>
        ) : (
          <div className="flex flex-col items-center justify-center gap-6 px-6 py-8 min-h-[220px] lg:min-h-[calc(100dvh-330px)]">
            <MicBox live={live} level={level} />
            <div className="w-full max-w-xl"><Waveform analyser={analyser} live={live} /></div>
            {!live && <button type="button" onClick={onGoPrep} className="font-body font-black text-sm underline underline-offset-4 decoration-2">有簡報？到「準備」上傳，上台時可以邊講邊翻頁</button>}
          </div>
        )}
        <div className="border-t-2 border-black px-4 py-3 min-h-[3.25rem] font-body font-bold text-sm">
          {micError ? <span className="text-alarm">{micError}</span>
            : live ? (liveText
                ? <span className="line-clamp-2">{aiTranscribe && <span className="font-black opacity-60">即時字幕（粗略，講完由 AI 重新聽寫）：</span>}{liveText}</span>
                : <span className="opacity-60">{aiTranscribe ? '錄音中。講完後 AI 會聽錄音寫出正確的逐字稿。' : SR ? '開始說話，逐字稿會即時出現在這裡……' : '正在錄音（這個瀏覽器不支援即時辨識，結束後可以貼上講稿）'}</span>)
            : judging ? '評審正在閱卷……'
            : deck ? '按開始後一邊講一邊翻頁，評審會記下每頁停留的時間與你在那頁講了什麼。'
            : '按開始後，計時與錄音同時開始。'}
        </div>
      </div>
      <aside className="flex flex-col gap-4 lg:sticky lg:top-[96px]">
        {bigBtn}
        {deck && (
          <div className="flex items-center gap-3 border-2 border-black bg-white p-2">
            <MicBox live={live} level={level} small />
            <div className="flex-1 min-w-0"><Waveform analyser={analyser} live={live} compact /></div>
          </div>
        )}
        <JudgeStatus cards={cards} />
        {!live && !judging && (
          <button type="button" onClick={onPaste} className={`${smallBtn} bg-white w-full py-2.5`}>不錄音？貼上講稿或上傳錄音檔</button>
        )}
      </aside>
    </section>
  );
}

function SlidesPanel({ deck, onFiles, onRemove, status, error, disabled, slideIdx, setSlideIdx }) {
  const [over, setOver] = useState(false);
  const inputRef = useRef(null);
  const drop = e => { e.preventDefault(); setOver(false); if (!disabled && e.dataTransfer.files.length) onFiles(e.dataTransfer.files); };
  return (
    <Panel title="Slides" zh="簡報（選填）"
      right={deck && <span className="font-body font-black text-xs border-2 border-black px-2 py-0.5 bg-mint">評審會逐頁看</span>}>
      {!deck ? (
        <div onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)} onDrop={drop}
          className={`border-2 border-dashed border-black p-6 flex flex-col items-center gap-3 text-center ${over ? 'bg-gold' : 'bg-paper'}`}>
          <button type="button" onClick={() => inputRef.current?.click()} disabled={disabled || !!status} className={`${smallBtn} bg-gold text-base px-5 py-2.5`}>
            {status ? status : '＋ 上傳簡報'}
          </button>
          <p className="font-body font-bold text-sm">支援 PDF、PPTX，或一次選多張投影片圖片。也可以直接把檔案拖進來。</p>
          <p className="font-body text-xs font-bold opacity-70">PDF 版面 100% 跟原檔一樣（最推薦）。PPTX 會照原本排版重畫，並讀取講者備註，但特殊字型、圖表、SmartArt 可能略有差異。Keynote、Google 簡報、Canva 請先下載成 PDF。</p>
        </div>
      ) : (
        <>
          <div className="flex flex-wrap items-center gap-3 justify-between">
            <div className="min-w-0">
              <div className="font-body font-black truncate">{deck.name}</div>
              <div className="font-mono text-xs">{deck.kind} · {deck.items.length} 頁{deck.total > deck.items.length ? `（共 ${deck.total} 頁，只讀前 ${deck.items.length} 頁）` : ''}{deck.kind === 'PPTX' ? (deck.rendered ? ' · 依原排版重畫' : ' · 只讀到文字') : ''}{deck.skippedHidden ? ` · 略過 ${deck.skippedHidden} 頁隱藏投影片` : ''}</div>
            </div>
            <div className="flex gap-3">
              <button type="button" onClick={() => inputRef.current?.click()} disabled={disabled || !!status} className={`${smallBtn} bg-white`}>{status || '換一份'}</button>
              <button type="button" onClick={onRemove} disabled={disabled} className={`${smallBtn} bg-white`}>移除</button>
            </div>
          </div>
          {deck.kind === 'PPTX' && (
            <p className="font-body text-sm font-bold border-2 border-black bg-paper px-3 py-2">
              {deck.rendered
                ? 'PPTX 是用網頁照原檔重畫的，字型或圖表可能和 PowerPoint 有一點差異。要完全一樣，請匯出 PDF 再上傳。'
                : '這份 PPTX 的版面重畫失敗，下面只是文字預覽。'}
              <span className="block mt-1 font-black">PowerPoint 匯出 PDF：Mac 選「檔案 → 匯出 → 檔案格式：PDF」；Windows 選「檔案 → 匯出 → 建立 PDF/XPS」。</span>
            </p>
          )}
          <div className="flex gap-3 overflow-x-auto pb-2">
            {deck.items.map((it, i) => (
              <button key={it.page} type="button" onClick={() => setSlideIdx(i)} disabled={disabled}
                className={`relative shrink-0 w-32 aspect-video border-2 border-black bg-paper overflow-hidden ${i === slideIdx ? 'outline outline-4 outline-gold' : ''}`}
                aria-label={`第 ${it.page} 頁`}>
                <img src={it.url} alt="" className="w-full h-full object-contain" />
                <span className="absolute bottom-0 left-0 bg-black text-white font-mono text-[10px] px-1">{it.page}</span>
              </button>
            ))}
          </div>
        </>
      )}
      {error && <p className="font-body font-black text-sm text-alarm">{error}</p>}
      <input ref={inputRef} type="file" hidden multiple accept=".pdf,.pptx,.key,.ppt,application/pdf,image/*"
        onChange={e => { if (e.target.files.length) onFiles(e.target.files); e.target.value = ''; }} />
    </Panel>
  );
}

function Prep({ rubric, setRubric, script, setScript, topic, setTopic, disabled, slidesPanel, onNext, deck }) {
  return (
    <div className="flex flex-col gap-6">
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        <Panel title="Rubric" zh="評比重點" right={<span className="font-body font-black text-xs border-2 border-black px-2 py-0.5 bg-gold">評審以這裡為最高依據</span>}>
          <p className="font-body text-sm font-bold -mb-2">寫法自由，可以標比重。例如「內容 40%：觀點要有數據支持」。</p>
          <textarea id="rubric" value={rubric} onChange={e => setRubric(e.target.value)} disabled={disabled} className={field + ' h-[38vh] lg:h-[calc(100dvh-360px)] min-h-[220px] resize-none'}></textarea>
          <div className="flex flex-wrap gap-3">
            <button type="button" onClick={() => setRubric(DEFAULT_RUBRIC)} disabled={disabled} className={`${smallBtn} bg-white`}>實習競賽標準</button>
            <button type="button" onClick={() => setRubric(GENERIC_RUBRIC)} disabled={disabled} className={`${smallBtn} bg-white`}>一般演講</button>
            <button type="button" onClick={() => setRubric('')} disabled={disabled} className={`${smallBtn} bg-white`}>清空</button>
          </div>
        </Panel>
        <div className="flex flex-col gap-6 min-w-0">
          {slidesPanel}
          <Panel title="Script" zh="題目與講稿（選填）">
            <div>
              <label htmlFor="topic" className="font-body font-black text-sm block mb-1">題目／場合</label>
              <input id="topic" value={topic} onChange={e => setTopic(e.target.value)} disabled={disabled} placeholder="例如：校外實習特色案例競賽複賽" className={field + ' py-2'} />
            </div>
            <div>
              <label htmlFor="script" className="font-body font-black text-sm block mb-1">事先準備的講稿：評審會比對你有沒有漏講或脫稿</label>
              <textarea id="script" value={script} onChange={e => setScript(e.target.value)} rows={4} disabled={disabled} placeholder="沒有講稿可以留空。" className={field}></textarea>
            </div>
          </Panel>
        </div>
      </div>
      <button type="button" onClick={onNext} className={`${pressable} w-full py-4 font-body font-black text-xl bg-[#FFD700]`}>
        準備好了，上台 ▶{deck ? `（${deck.items.length} 頁簡報）` : ''}
      </button>
    </div>
  );
}

function Metrics({ a }) {
  const items = [
    ['時長', fmt(a.duration), a.target && a.duration > a.target * 60 * 1.15],
    ['字數', a.chars, false],
    ['語速/分', a.cpm, a.chars > 0 && (a.cpm > 260 || a.cpm < 150)],
    ['停頓', `${a.pauses} 次`, false],
    ['口頭禪', `${a.fillerTotal} 次`, a.fillerTotal >= 6],
    ['音量起伏', round1(a.volumeVar), a.duration > 15 && a.volumeVar < 0.35],
  ];
  return (
    <div className="grid grid-cols-3 lg:grid-cols-6 border-2 border-black bg-black gap-[2px]">
      {items.map(([k, v, bad]) => (
        <div key={k} className={`px-3 py-2 ${bad ? 'bg-alarm text-white' : 'bg-white'}`}>
          <div className="font-body font-black text-xs">{k}</div>
          <div className="font-mono text-xl tabular-nums">{v}</div>
        </div>
      ))}
    </div>
  );
}

function Content({ phase, audio, transcript, setTranscript, onJudge, metrics, sendAudio, hasGemini, isArtifact, source, onAudioFile, onRetranscribe }) {
  const ext = audio?.name ? audio.name.split('.').pop() : audio?.type?.includes('mp4') ? 'm4a' : 'webm';
  const judging = phase === 'judging', live = phase === 'live';
  const fileRef = useRef(null);
  const srcLabel = { ai: 'AI 聽寫', browser: '瀏覽器即時辨識（不準，建議用 AI 重新聽寫）', manual: '手動輸入' }[source] || '';
  return (
    <Panel title="Speech" zh="演講內容"
      right={audio?.url && hasGemini && <span className="font-body font-black text-xs border-2 border-black px-2 py-0.5 bg-white">{sendAudio ? '錄音會一起交給 Gemini 聽' : '只送文字'}</span>}>
      {metrics && <Metrics a={metrics} />}
      {audio?.url && (
        <div className="flex flex-col sm:flex-row gap-3 sm:items-center">
          <audio controls src={audio.url} className="flex-1 min-w-0"></audio>
          {!isArtifact && <a href={audio.url} download={audio.name || `SpeakArena-${new Date().toISOString().slice(0, 16).replace(/[:T-]/g, '')}.${ext}`} className={`${smallBtn} bg-white text-center no-underline text-black`}>下載錄音</a>}
        </div>
      )}
      <div>
        <div className="flex flex-wrap items-end justify-between gap-2 mb-1">
          <label htmlFor="transcript" className="font-body font-black text-sm">逐字稿{srcLabel && <span className={`ml-2 border-2 border-black px-1.5 py-0.5 text-xs ${source === 'ai' ? 'bg-mint' : source === 'browser' ? 'bg-gold' : 'bg-white'}`}>{srcLabel}</span>}</label>
          <span className="font-body text-xs font-bold opacity-70">有錯字可以直接改；也可以不錄音，直接貼上演講內容</span>
        </div>
        <textarea id="transcript" value={transcript} onChange={e => setTranscript(e.target.value)} rows={6} disabled={live || judging}
          placeholder={hasGemini ? '錄音結束後，AI 會聽錄音寫出逐字稿。' : '錄音結束後逐字稿會出現在這裡。'} className={field}></textarea>
      </div>
      <div className="flex flex-wrap gap-3">
        <button type="button" onClick={onJudge} disabled={live || judging || (!transcript.trim() && !audio?.blob)} className={`${smallBtn} bg-gold`}>
          {phase === 'done' ? '依目前內容重新評比' : '送出評比'}
        </button>
        {!isArtifact && <button type="button" onClick={() => fileRef.current?.click()} disabled={live || judging} className={`${smallBtn} bg-white`}>上傳錄音檔</button>}
        {audio?.blob && hasGemini && <button type="button" onClick={onRetranscribe} disabled={live || judging} className={`${smallBtn} bg-white`}>AI 重新聽寫</button>}
        <button type="button" onClick={() => { try { navigator.clipboard.writeText(transcript).catch(() => {}); } catch (e) {} }} disabled={!transcript} className={`${smallBtn} bg-white`}>複製逐字稿</button>
      </div>
      <input ref={fileRef} type="file" hidden accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.mp4,.mov"
        onChange={e => { const f = e.target.files[0]; if (f) onAudioFile(f); e.target.value = ''; }} />
    </Panel>
  );
}

function Results({ result, engine }) {
  if (!result || !result.rubric.length) return null;
  const { rubric, total, strengths, priorities, rewrite, scriptCheck } = result;
  const level = total == null ? '' : total >= 90 ? '冠軍水準' : total >= 80 ? '可以上場了' : total >= 70 ? '再練幾次就很穩' : total >= 60 ? '架構有了，細節要修' : '建議重整主軸';
  return (
    <Panel title="Scorecard" zh="評分表" right={<span className="font-mono text-xs border-2 border-black px-2 py-0.5 bg-white">{engine}</span>}>
      <div className="flex flex-wrap items-stretch gap-4">
        <div className={`bg-black text-gold border-2 border-black px-5 py-3 ${hard4}`}>
          <div className="font-body font-black text-xs text-white">加權總分</div>
          <div className="font-mono text-5xl tabular-nums leading-none mt-1">{total ?? '—'}<span className="text-lg text-white">/100</span></div>
        </div>
        <div className="flex flex-col justify-center min-w-0">
          <div className="font-body font-black text-2xl">{level}</div>
          <div className="font-body text-sm font-bold opacity-70">依你的 {rubric.length} 項評比重點與比重計算</div>
        </div>
      </div>

      <div className="flex flex-col border-2 border-black">
        {rubric.map((r, i) => (
          <div key={i} className={`grid grid-cols-1 md:grid-cols-[220px_1fr] ${i ? 'border-t-2 border-black' : ''}`}>
            <div className="p-3 bg-paper md:border-r-2 border-black flex md:flex-col justify-between gap-2">
              <div className="min-w-0">
                <div className="font-body font-black leading-snug">{r.criterion}</div>
                <div className="font-mono text-xs mt-0.5">比重 {r.weight}%</div>
              </div>
              <div className="shrink-0 md:w-full">
                <div className="font-mono text-3xl tabular-nums leading-none text-right md:text-left">{r.score == null ? 'N/A' : r.score}<span className="text-sm">{r.score == null ? '' : '/10'}</span></div>
                {r.score != null && <div className="hidden md:block h-3 border-2 border-black bg-white mt-2"><div className={`h-full ${r.score >= 8 ? 'bg-mint' : r.score >= 6 ? 'bg-gold' : 'bg-alarm'}`} style={{ width: `${r.score * 10}%` }}></div></div>}
              </div>
            </div>
            <div className="p-3 flex flex-col gap-2 min-w-0 font-body text-[15px] leading-relaxed">
              {r.evidence && <div className="border-l-4 border-black pl-3 font-bold">「{r.evidence}」</div>}
              <p>{r.comment}</p>
              {r.fix && <p className="bg-gold border-2 border-black px-2 py-1 font-bold"><span className="font-black">怎麼改：</span>{r.fix}</p>}
            </div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {strengths.length > 0 && <div className="border-2 border-black p-3 bg-mint"><h4 className="font-body font-black mb-1">保留這些優點</h4><ul className="list-disc pl-5 font-body font-bold text-[15px] leading-relaxed">{strengths.map((s, i) => <li key={i}>{s}</li>)}</ul></div>}
        {priorities.length > 0 && <div className="border-2 border-black p-3 bg-pink"><h4 className="font-body font-black mb-1">下次練習先改</h4><ol className="list-decimal pl-5 font-body font-bold text-[15px] leading-relaxed">{priorities.map((s, i) => <li key={i}>{s}</li>)}</ol></div>}
      </div>

      {rewrite?.original && rewrite?.improved && (
        <div className="border-2 border-black">
          <div className="border-b-2 border-black px-3 py-1.5 bg-black text-white font-body font-black text-sm">示範改寫</div>
          <div className="grid grid-cols-1 md:grid-cols-2">
            <div className="p-3 md:border-r-2 border-b-2 md:border-b-0 border-black font-body text-[15px] leading-relaxed"><div className="font-black text-xs mb-1">原本</div><p className="line-through decoration-2 opacity-70">{rewrite.original}</p></div>
            <div className="p-3 font-body text-[15px] leading-relaxed bg-paper"><div className="font-black text-xs mb-1">改成</div><p className="font-bold">{rewrite.improved}</p></div>
          </div>
        </div>
      )}
      {scriptCheck && <div className="border-2 border-black p-3"><h4 className="font-body font-black mb-1">與講稿比對</h4><p className="font-body text-[15px] leading-relaxed whitespace-pre-line">{scriptCheck}</p></div>}
    </Panel>
  );
}

const LEVEL_UI = {
  good: { label: '順暢', cls: 'bg-mint text-black' },
  warn: { label: '注意', cls: 'bg-gold text-black' },
  bad: { label: '問題', cls: 'bg-alarm text-white' },
};

function SlideReview({ deck, review, segments, onJump }) {
  if (!deck || !review || (!review.slides.length && !review.flow)) return null;
  const segMap = Object.fromEntries((segments || []).map(s => [s.page, s]));
  const revMap = Object.fromEntries(review.slides.map(s => [s.page, s]));
  const maxSec = Math.max(1, ...(segments || []).map(s => s.seconds));
  const counts = { good: 0, warn: 0, bad: 0 };
  deck.items.forEach(it => { const r = revMap[it.page]; if (r) counts[r.level]++; });
  return (
    <Panel title="Slides" zh="逐頁講評"
      right={<span className="font-mono text-xs flex gap-1">{['good', 'warn', 'bad'].map(k => <span key={k} className={`border-2 border-black px-1.5 ${LEVEL_UI[k].cls}`}>{LEVEL_UI[k].label} {counts[k]}</span>)}</span>}>
      {review.flow && (
        <div className="border-2 border-black">
          <div className="border-b-2 border-black px-3 py-1.5 bg-black text-white font-body font-black text-sm">整體流暢度與轉場</div>
          <p className="p-3 font-body text-[15px] leading-relaxed whitespace-pre-line">{review.flow}</p>
        </div>
      )}
      <div className="flex flex-col border-2 border-black">
        {deck.items.map((it, i) => {
          const r = revMap[it.page], seg = segMap[it.page], ui = LEVEL_UI[r?.level || 'warn'];
          return (
            <div key={it.page} className={`grid grid-cols-1 sm:grid-cols-[176px_1fr] ${i ? 'border-t-2 border-black' : ''}`}>
              <button type="button" onClick={() => onJump(i)} className="relative block bg-paper sm:border-r-2 border-b-2 sm:border-b-0 border-black aspect-video sm:aspect-auto sm:min-h-[100px] overflow-hidden" aria-label={`在舞台上顯示第 ${it.page} 頁`}>
                <img src={it.url} alt="" className="absolute inset-0 w-full h-full object-contain" />
                <span className="absolute top-0 left-0 bg-black text-gold font-mono text-xs px-1.5 py-0.5">P{it.page}</span>
              </button>
              <div className="p-3 flex flex-col gap-2 min-w-0 font-body text-[15px] leading-relaxed">
                <div className="flex flex-wrap items-center gap-2">

function App() {
  const [phase, setPhase] = useState('idle');
  const [seconds, setSeconds] = useState(0);
  const [target, setTarget] = useState(() => store.get('target', 3));
  const [cards, setCards] = useState(JUDGES.map(() => ({ state: 'idle', text: '', score: null })));
  const [analyser, setAnalyser] = useState(null);
  const [micError, setMicError] = useState('');
  const [liveText, setLiveText] = useState('');
  const [transcript, setTranscript] = useState('');
  const [audio, setAudio] = useState(null);
  const [metrics, setMetrics] = useState(null);
  const [result, setResult] = useState(null);
  const [engine, setEngine] = useState('');
  const [notice, setNotice] = useState('');
  const [level, setLevel] = useState(0);
  const [rubric, setRubric] = useState(() => { const r = store.get('rubric', DEFAULT_RUBRIC); return /^【範例評比重點/.test(r) ? DEFAULT_RUBRIC : r; });
  const [deck, setDeck] = useState(null);
  const [slideIdx, setSlideIdx] = useState(0);
  const [slideStatus, setSlideStatus] = useState('');
  const [slideError, setSlideError] = useState('');
  const [segments, setSegments] = useState(null);
  const [slideSec, setSlideSec] = useState(0);
  const [source, setSource] = useState('');
  const [view, setViewRaw] = useState(() => store.get('view', 'prep'));
  const [reviewTab, setReviewTab] = useState('judges');
  const setView = v => { setViewRaw(v); store.set('view', v); try { window.scrollTo({ top: 0 }); } catch (e) {} };
  const [script, setScript] = useState(() => store.get('script', ''));
  const [topic, setTopic] = useState(() => store.get('topic', ''));
  const [settings, setSettings] = useState(() => store.get('settings', { apiKey: '', model: GEMINI_MODELS[0].id, sendAudio: true }));
  const [showSettings, setShowSettings] = useState(false);
  const [isArtifact, setIsArtifact] = useState(false);

  const timers = useRef([]);
  const rec = useRef({});
  const startAt = useRef(0);
  const resultsRef = useRef(null);
  const live = useRef({ phase: 'idle', deck: null, idx: 0, view: 'prep' });
  live.current = { phase, deck, idx: slideIdx, view };

  // 換頁：錄音中會記下時間點和當時逐字稿的位置
  function goSlide(i) {
    const d = live.current.deck; if (!d) return;
    const next = clamp(i, 0, d.items.length - 1);
    if (next === live.current.idx) return;
    setSlideIdx(next);
    const r = rec.current;
    if (live.current.phase === 'live' && r.slideLog) {
      const t = (Date.now() - startAt.current) / 1000;
      const pos = (r.finalText || '').length + (r.interim || '').length;
      r.slideLog.push({ page: d.items[next].page, t, pos });
      setSlideSec(0);
    }
  }

  // 方向鍵、PageUp/PageDown（簡報筆）翻頁
  useEffect(() => {
    const onKey = e => {
      if (!live.current.deck || live.current.phase === 'judging' || live.current.view !== 'stage') return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); goSlide(live.current.idx + 1); }
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); goSlide(live.current.idx - 1); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  async function onSlideFiles(files) {
    setSlideError(''); setSlideStatus('讀取中…');
    try {
      const d = await parseSlides(files, setSlideStatus);
      if (!d.items.length) throw new Error('這份簡報沒有任何頁面');
      deck?.items.forEach(it => URL.revokeObjectURL(it.url));
      setDeck({ ...d, id: Date.now() }); setSlideIdx(0); setSegments(null);
    } catch (e) {
      setSlideError('簡報讀取失敗：' + (e?.message || e));
    }
    setSlideStatus('');
  }
  function removeDeck() { deck?.items.forEach(it => URL.revokeObjectURL(it.url)); setDeck(null); setSlideIdx(0); setSegments(null); }

  useEffect(() => { store.set('rubric', rubric); }, [rubric]);
  useEffect(() => { store.set('script', script); }, [script]);
  useEffect(() => { store.set('topic', topic); }, [topic]);
  useEffect(() => { store.set('target', target); }, [target]);
  useEffect(() => { getSample().then(s => setIsArtifact(!!s)); }, []);
  useEffect(() => {
    if (phase !== 'live') return;
    const id = setInterval(() => {
      const now = (Date.now() - startAt.current) / 1000;
      setSeconds(Math.floor(now));
      const log = rec.current.slideLog;
      if (log && log.length) setSlideSec(Math.floor(now - log[log.length - 1].t));
    }, 250);
    return () => clearInterval(id);
  }, [phase]);
  useEffect(() => () => { timers.current.forEach(clearTimeout); stopAll(); }, []);

  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.current.push(id); };
  const hasGemini = !!settings.apiKey && !isArtifact;
  const saveModel = id => { setSettings(s0 => { const s2 = { ...s0, model: id }; store.set('settings', s2); return s2; }); };

  // 給 AI 聽寫的專有名詞提示：題目、投影片文字、講稿
  function aiTranscribe(blob) {
    const hints = [topic.trim(), deck ? deck.items.map(x => x.text).join(' ').replace(/\s+/g, ' ').slice(0, 1500) : '', script.trim().slice(0, 800)].filter(Boolean).join('\n');
    return transcribeWithGemini({ apiKey: settings.apiKey, model: settings.model, audioBlob: blob, hints, onStatus: setNotice, onModelChange: saveModel });
  }
  function slideSegsFor(r, duration, raw) {
    if (!deck || r.slideDeckId !== deck.id || !r.slideLog) return null;
    return r.timed ? buildSegmentsTimed(r.slideLog, duration, r.timed) : buildSegments(r.slideLog, duration, raw);
  }
  const engineLabel = hasGemini ? 'Gemini 評審' : isArtifact ? 'Claude 評審' : '設定 AI 評審';

  function stopAll() {
    const r = rec.current;
    cancelAnimationFrame(r.raf);
    try { if (r.recognition) { r.keepRecognizing = false; r.recognition.stop(); } } catch (e) {}
    try { r.recorder && r.recorder.state !== 'inactive' && r.recorder.stop(); } catch (e) {}
    try { r.stream && r.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { r.audioCtx && r.audioCtx.close(); } catch (e) {}
    try { r.wake && r.wake.release(); } catch (e) {}
  }

  async function startSpeech() {
    timers.current.forEach(clearTimeout); timers.current = [];
    setView('stage');
    setMicError(''); setLiveText(''); setTranscript(''); setSource(''); setMetrics(null); setResult(null); setNotice('');
    if (audio?.url) URL.revokeObjectURL(audio.url);
    setAudio(null);
    const r = rec.current = { finalText: '', chunks: [], pauses: 0, longestPause: 0, silentSince: null, speakingRms: [], keepRecognizing: true };

    if (canRecord) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        r.stream = stream;
        const recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => e.data.size && r.chunks.push(e.data);
        recorder.start(1000); r.recorder = recorder;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const an = audioCtx.createAnalyser(); an.fftSize = 1024;
        audioCtx.createMediaStreamSource(stream).connect(an);
        r.audioCtx = audioCtx; setAnalyser(an);
        const tbuf = new Float32Array(an.fftSize); let lastUi = 0;
        const loop = () => {
          an.getFloatTimeDomainData(tbuf);
          let sum = 0; for (let i = 0; i < tbuf.length; i++) sum += tbuf[i] * tbuf[i];
          const rms = Math.sqrt(sum / tbuf.length), t = performance.now() / 1000;
          if (rms < SILENCE_RMS) { if (r.silentSince == null) r.silentSince = t; }
          else {
            if (r.silentSince != null) { const d = t - r.silentSince; if (d >= PAUSE_SEC && r.heardVoice) { r.pauses++; r.longestPause = Math.max(r.longestPause, d); } }
            r.silentSince = null; r.heardVoice = true; r.speakingRms.push(rms);
          }
          if (t - lastUi > 0.15) { setLevel(rms); lastUi = t; }
          r.raf = requestAnimationFrame(loop);
        };
        loop();
      } catch (e) {
        setMicError(e?.name === 'NotAllowedError' ? '麥克風權限被拒絕：這次只會計時，結束後可以把演講內容貼進逐字稿再評比。' : '這裡無法使用麥克風：這次只會計時，結束後可以把演講內容貼進逐字稿再評比。');
      }
    } else setMicError('這個瀏覽器不支援錄音：這次只會計時，結束後可以把演講內容貼進逐字稿再評比。');

    if (SR && r.stream) {
      const recog = new SR();
      recog.lang = 'zh-TW'; recog.continuous = true; recog.interimResults = true;
      recog.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) { const res = e.results[i]; if (res.isFinal) r.finalText += res[0].transcript + '，'; else interim += res[0].transcript; }
        r.interim = interim;
        setLiveText((r.finalText + interim).slice(-120));
      };
      recog.onend = () => { if (r.keepRecognizing) { try { recog.start(); } catch (e) {} } };
      recog.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { r.keepRecognizing = false; setMicError('即時辨識被瀏覽器擋住，錄音照常進行。有設定 Gemini 的話，評審會直接聽錄音。'); } };
      try { recog.start(); r.recognition = recog; } catch (e) {}
    }
    try { r.wake = await navigator.wakeLock?.request('screen'); } catch (e) {}

    startAt.current = Date.now(); setSeconds(0); setSlideSec(0); setSegments(null);
    if (deck) { setSlideIdx(0); r.slideLog = [{ page: deck.items[0].page, t: 0, pos: 0 }]; r.slideDeckId = deck.id; }
    setCards(JUDGES.map(() => ({ state: 'listening', text: '', score: null })));
    setPhase('live');
  }

  function buildMetrics(duration) {
    const r = rec.current, v = r.speakingRms || [];
    let volumeVar = 0;
    if (v.length > 10) { const mean = v.reduce((a, b) => a + b, 0) / v.length; volumeVar = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length) / mean; }
    return { duration, target, pauses: r.pauses || 0, longestPause: r.longestPause || 0, volumeVar };
  }

  async function runJudging(text, m, audioBlob, segs, preNotice = '') {
    timers.current.forEach(clearTimeout); timers.current = [];
    setPhase('judging'); setResult(null); setNotice('');
    setView('review'); setReviewTab('judges');
    setCards(JUDGES.map(() => ({ state: 'waiting', text: '', score: null })));
    const a = analyze(text, m);
    setMetrics(a);

    let out = null, used = '數據評審（未接 AI）';
    const sendAudio = settings.sendAudio && audioBlob;
    const promptFor = ({ imagePages = [], hasAudio = false }) => buildPrompt({ text, a, rubric, script, topic, hasAudio, deck, segments: segs, imagePages });

    let finalNotice = '';
    if (hasGemini) {
      try {
        let looked = 0;
        out = normalize(await geminiReview({
          apiKey: settings.apiKey, model: settings.model, deck, audioBlob: sendAudio ? audioBlob : null, onStatus: setNotice,
          promptFor: o => { looked = o.imagePages.length; return promptFor(o); },
          onModelChange: id => { const s2 = { ...settings, model: id }; setSettings(s2); store.set('settings', s2); },
        }));
        used = `Gemini${sendAudio ? ' · 有聽錄音' : ''}${deck ? (looked ? ' · 有看投影片' : ' · 有讀投影片文字') : ''}`;
      } catch (e) { finalNotice = 'Gemini 評比失敗：' + e.message + ' 這次先改用數據評審。'; }
    } else if (isArtifact && (text.trim().length >= 15 || deck)) {
      setNotice(deck ? 'Claude 評審正在看投影片、閱卷中…' : 'Claude 評審閱卷中…');
      try {
        const sample = await getSample();
        let images = [], imagePages = [];
        const visual = deck ? deck.items.filter(x => x.visual) : [];
        if (visual.length) {
          const caps = await sample.limits().catch(() => null);
          const max = caps?.images?.maxCount || 0;
          if (max) {
            const pick = visual.length <= max ? visual : Array.from({ length: max }, (_, k) => visual[Math.round(k * (visual.length - 1) / (max - 1 || 1))]);
            const uniq = [...new Map(pick.map(x => [x.page, x])).values()];
            images = uniq.map(x => x.blob); imagePages = uniq.map(x => x.page);
          }
        }
        let prompt = promptFor({ imagePages, hasAudio: false });
        if (imagePages.length) prompt += `\n\n附上的圖片依序是第 ${imagePages.join('、')} 頁投影片。`;
        out = normalize(await sample.json(prompt, images.length ? { modelTier: 'default', images } : { modelTier: 'default' }));
        used = `Claude 評審${deck ? (imagePages.length ? ' · 有看投影片' : ' · 有讀投影片文字') : ''}`;
      }
      catch (e) { finalNotice = 'Claude 評比失敗：' + (e?.message || e?.code || '未知錯誤') + ' 這次先改用數據評審。'; }
    } else if (!isArtifact) {
      finalNotice = '還沒設定 Gemini API 金鑰，這次用數據評審（不會依你的評比重點逐項打分，也看不懂投影片內容）。按右上角 ⚙ 設定後即可精細講評。';
    }
    if (out && !out.rubric.length) out = null;
    if (!out) out = ruleReviews(a);
    if (deck && !out.slides?.length) { const rs = ruleSlides(deck, segs); out = { ...out, slides: rs.slides, flow: out.flow || rs.flow }; }
    setSegments(segs || null);
    setNotice([preNotice, finalNotice].filter(Boolean).join(' '));
    setEngine(used); setResult(out);

    let delay = 300;
    JUDGES.forEach((j, idx) => {
      const full = out.judges[j.id].text, score = round1(out.judges[j.id].score);
      const chunk = full.length > 200 ? 4 : 2, step = 22;
      later(() => setCards(cs => cs.map((c, i) => i === idx ? { state: 'typing', text: '', score: null } : c)), delay);
      for (let k = chunk; k < full.length + chunk; k += chunk) later(() => setCards(cs => cs.map((c, i) => i === idx ? { ...c, text: full.slice(0, k) } : c)), delay + (k / chunk) * step);
      delay += (full.length / chunk) * step + 150;
      later(() => setCards(cs => cs.map((c, i) => i === idx ? { state: 'done', text: full, score } : c)), delay);
      delay += 350;
    });
    later(() => setPhase('done'), delay);
  }

  async function endSpeech() {
    const duration = (Date.now() - startAt.current) / 1000;
    setSeconds(Math.floor(duration));
    const r = rec.current; r.keepRecognizing = false;
    const m = buildMetrics(duration);
    const audioDone = new Promise(res => { if (r.recorder && r.recorder.state !== 'inactive') r.recorder.onstop = res; else res(); });
    stopAll(); setAnalyser(null); setLevel(0);
    await Promise.race([audioDone, new Promise(res => setTimeout(res, 1500))]);
    await new Promise(res => setTimeout(res, 600));
    let blob = null;
    if (r.chunks.length) { blob = new Blob(r.chunks, { type: r.recorder?.mimeType || 'audio/webm' }); setAudio({ url: URL.createObjectURL(blob), type: blob.type, blob }); }
    const raw = (r.finalText || '') + (r.interim || '');
    let text = raw.replace(/，$/, ''), src = text ? 'browser' : '', pre = '';
    r.lastMetrics = m; r.timed = null;
    if (hasGemini && blob) {
      // 瀏覽器辨識不準 → 交給 Gemini 聽錄音重新寫逐字稿
      setPhase('judging'); setTranscript(''); setCards(JUDGES.map(() => ({ state: 'waiting', text: '', score: null })));
      setView('review'); setReviewTab('judges');
      try {
        const tr = await aiTranscribe(blob);
        text = tr.text; src = 'ai'; r.timed = tr.segments;
        if (tr.truncated) pre = `錄音超過 ${fmt(MAX_AUDIO_SEC)}，AI 只聽寫了前段。`;
      } catch (e) { pre = `AI 聽寫失敗（${e.message}），先用瀏覽器辨識的逐字稿。`; }
    }
    setTranscript(text); setSource(src);
    r.slideSegments = slideSegsFor(r, duration, raw);
    runJudging(text, m, blob, r.slideSegments, pre);
  }

  async function judgeNow() {
    const r = rec.current;
    const m = r.lastMetrics || { duration: seconds || Math.round(countChars(transcript) / 220 * 60), target, pauses: 0, longestPause: 0, volumeVar: 0 };
    let text = transcript, pre = '';
    if (!text.trim() && audio?.blob && hasGemini) {
      setPhase('judging'); setCards(JUDGES.map(() => ({ state: 'waiting', text: '', score: null })));
      try { const tr = await aiTranscribe(audio.blob); text = tr.text; r.timed = tr.segments; setTranscript(text); setSource('ai'); r.slideSegments = slideSegsFor(r, m.duration, ''); }
      catch (e) { pre = `AI 聽寫失敗（${e.message}）。`; }
    }
    const segs = deck && r.slideDeckId === deck.id ? r.slideSegments : null;
    runJudging(text, { ...m, target }, audio?.blob || null, segs, pre);
  }

  async function retranscribe() {
    const r = rec.current;
    if (!audio?.blob) return;
    setPhase('judging');
    try {
      const tr = await aiTranscribe(audio.blob);
      r.timed = tr.segments; setTranscript(tr.text); setSource('ai');
      if (r.lastMetrics) r.slideSegments = slideSegsFor(r, r.lastMetrics.duration, '');
      setNotice('AI 聽寫完成。檢查一下逐字稿，再按「依目前內容重新評比」。');
    } catch (e) { setNotice('AI 聽寫失敗：' + e.message); }
    setPhase(result ? 'done' : 'idle');
  }

  // 上傳錄音檔（例如手機錄音 App 錄好的 m4a）
  async function onAudioFile(file) {
    if (file.size > 500 * 1024 * 1024) { setNotice('錄音檔超過 500MB，請先剪短或只匯出聲音。'); return; }
    timers.current.forEach(clearTimeout); timers.current = [];
    setNotice('讀取錄音檔中…'); setResult(null); setMetrics(null);
    let d;
    try { d = await decodeMono(file, 16000, 7200); }
    catch (e) { setNotice('錄音檔讀取失敗：' + e.message); return; }
    if (audio?.url) URL.revokeObjectURL(audio.url);
    setAudio({ url: URL.createObjectURL(file), type: file.type, blob: file, name: file.name, uploaded: true });
    const m = { duration: d.fullSeconds, target, ...pcmStats(d.pcm, d.rate) };
    rec.current = { lastMetrics: m, slideLog: null, timed: null };
    setSeconds(Math.round(d.fullSeconds)); setSegments(null);
    if (!hasGemini) {
      setTranscript(''); setSource('');
      setNotice(`已載入錄音檔（${fmt(d.fullSeconds)}）。要讓 AI 聽寫與講評，請先按右上角 ⚙ 設定 Gemini；或自己把內容貼進逐字稿再按送出評比。`);
      return;
    }
    setPhase('judging'); setTranscript(''); setCards(JUDGES.map(() => ({ state: 'waiting', text: '', score: null })));
    setView('review'); setReviewTab('judges');
    let text = '', pre = '';
    try { const tr = await aiTranscribe(file); text = tr.text; rec.current.timed = tr.segments; setSource('ai'); if (tr.truncated) pre = `錄音超過 ${fmt(MAX_AUDIO_SEC)}，AI 只聽寫了前段。`; }
    catch (e) { pre = `AI 聽寫失敗（${e.message}）。`; }
    setTranscript(text);
    runJudging(text, m, file, null, pre);
  }

  const onToggle = () => (phase === 'live' ? endSpeech() : startSpeech());
  const doneCards = cards.filter(c => c.state === 'done' && c.score != null);
  const avg = doneCards.length === 4 ? round1(doneCards.reduce((s, c) => s + c.score, 0) / 4) : null;
  const busy = phase === 'live' || phase === 'judging';

  const total = result?.total;
  const badges = {
    prep: deck ? { text: `${deck.items.length}頁`, cls: 'bg-mint text-black' } : null,
    stage: phase === 'live' ? { text: 'REC', cls: 'bg-alarm text-white' } : null,
    review: phase === 'judging' ? { text: '…', cls: 'bg-gold text-black' } : total != null ? { text: String(total), cls: 'bg-gold text-black' } : avg != null ? { text: String(avg), cls: 'bg-gold text-black' } : null,
  };
  const tabs = REVIEW_TABS.filter(t => t.id !== 'slides' || deck);
  const tabBadge = { judges: avg != null ? `${avg}` : '', score: total != null ? `${total}` : '', slides: '', speech: '' };
  const banner = notice && (
    <div className={`border-2 border-black p-3 font-body font-black ${/失敗|還沒/.test(notice) ? 'bg-alarm text-white' : 'bg-white'} ${hard4}`} role="status">{notice}</div>
  );

  return (
    <div className="grid-bg min-h-screen flex flex-col" data-phase={phase} data-view={view}>
      <Header seconds={seconds} phase={phase} target={target} onSettings={() => setShowSettings(true)} engineLabel={engineLabel} view={view} setView={setView} badges={badges} />

      <main className="flex-1 mx-auto w-full max-w-7xl pt-5 pb-28 md:pb-10 flex flex-col gap-5" style={gutter}>
        {view === 'prep' && (
          <>
            {!hasGemini && !isArtifact && (
              <div className={`flex flex-col sm:flex-row sm:items-center gap-3 justify-between bg-gold border-2 border-black p-3 ${hard4}`}>
                <p className="font-body font-black text-sm">還沒接上 Google Gemini。設定 API 金鑰後，AI 會聽錄音寫逐字稿，並依你的評比重點逐項打分。</p>
                <button type="button" onClick={() => setShowSettings(true)} className={`${smallBtn} bg-white shrink-0`}>⚙ 前往設定</button>
              </div>
            )}
            <Prep rubric={rubric} setRubric={setRubric} script={script} setScript={setScript} topic={topic} setTopic={setTopic} disabled={busy} deck={deck}
              onNext={() => setView('stage')}
              slidesPanel={<SlidesPanel deck={deck} onFiles={onSlideFiles} onRemove={removeDeck} status={slideStatus} error={slideError} disabled={busy} slideIdx={slideIdx} setSlideIdx={i => setSlideIdx(i)} />} />
          </>
        )}

        {view === 'stage' && (
          <Stage phase={phase} onToggle={onToggle} analyser={analyser} target={target} setTarget={setTarget} micError={micError} liveText={liveText} level={level}
            deck={deck} slideIdx={slideIdx} setSlideIdx={goSlide} slideSec={slideSec} aiTranscribe={hasGemini} cards={cards}
            onPaste={() => { setView('review'); setReviewTab('speech'); }} onGoPrep={() => setView('prep')} />
        )}

        {view === 'review' && (
          <>
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex gap-2 overflow-x-auto pb-1 pr-1" role="tablist" aria-label="講評內容">
                {tabs.map(t => (
                  <button key={t.id} type="button" role="tab" aria-selected={reviewTab === t.id} onClick={() => setReviewTab(t.id)}
                    className={`shrink-0 border-2 border-black px-3 py-1.5 font-body font-black text-sm flex items-center gap-1.5 ${reviewTab === t.id ? 'bg-black text-gold' : `bg-white ${hard4} hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-[transform,box-shadow] duration-100`}`}>
                    {t.label}{tabBadge[t.id] && <span className={`font-mono text-xs px-1 ${reviewTab === t.id ? 'bg-gold text-black' : 'bg-paper'}`}>{tabBadge[t.id]}</span>}
                  </button>
                ))}
              </div>
              {engine && phase !== 'judging' && <span className="font-mono text-xs border-2 border-black px-2 py-0.5 bg-white">{engine}</span>}
            </div>
            {banner}

            {reviewTab === 'judges' && (
              <div className="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-3 pr-[6px] lg:grid lg:grid-cols-4 lg:gap-5 lg:overflow-visible">
                {JUDGES.map((j, i) => <JudgeCard key={j.id} judge={j} state={cards[i].state} text={cards[i].text} score={cards[i].score} />)}
              </div>
            )}
            {reviewTab === 'judges' && <p className="lg:hidden font-body font-bold text-xs text-center opacity-70 -mt-2">← 左右滑動看四位評審 →</p>}

            {reviewTab === 'score' && (result?.rubric?.length
              ? <Results result={result} engine={engine} />
              : <EmptyState phase={phase} onPaste={() => setReviewTab('speech')} onStage={() => setView('stage')} what="評分表" needAI={!!result} />)}

            {reviewTab === 'slides' && (result?.slides?.length
              ? <SlideReview deck={deck} review={result} segments={segments} onJump={i => { setSlideIdx(i); setView('stage'); }} />
              : <EmptyState phase={phase} onPaste={() => setReviewTab('speech')} onStage={() => setView('stage')} what="逐頁講評" />)}

            {reviewTab === 'speech' && (
              <Content phase={phase} audio={audio} transcript={transcript} setTranscript={t => { setTranscript(t); if (source !== 'manual' && !t) setSource(''); else if (!source) setSource('manual'); }} onJudge={judgeNow} metrics={metrics} sendAudio={settings.sendAudio} hasGemini={hasGemini}
                isArtifact={isArtifact} source={source} onAudioFile={onAudioFile} onRetranscribe={retranscribe} />
            )}
          </>
        )}
      </main>

      <BottomNav view={view} setView={setView} badges={badges} />
      <Settings open={showSettings} onClose={() => setShowSettings(false)} settings={settings} setSettings={setSettings} isArtifact={isArtifact} />
    </div>
  );
}

function EmptyState({ phase, onPaste, onStage, what, needAI }) {
  return (
    <div className={`bg-white border-2 border-black ${hard6} p-6 flex flex-col items-center text-center gap-4`}>
      <p className="font-body font-black text-lg">{phase === 'judging' ? `評審正在閱卷，${what}等一下就會出現。` : needAI ? `這次是數據評審，沒有${what}。接上 Gemini 後再評一次就會有。` : `還沒有${what}。`}</p>
      {phase !== 'judging' && (
        <div className="flex flex-wrap justify-center gap-3">
          <button type="button" onClick={onStage} className={`${smallBtn} bg-gold`}>到「上台」開始演講</button>
          <button type="button" onClick={onPaste} className={`${smallBtn} bg-white`}>貼上講稿或上傳錄音檔</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
